image: darrkenn/cythe-rust:latest
steps:
  - name: Checkout repo
    use: cythe-checkout
  - name: Create directories
    run: mkdir -p /etc/cythe/secrets/darrkenn
  - name: Create secret file
    run: touch /etc/cythe/secrets/darrkenn/cythe.secret && printf "9e989623257bb798879f668168fa1f3efbfce4c458a985896ef1d414fd6e733c\n" >> /etc/cythe/secrets/darrkenn/cythe.secret
  - name: Run tests
    run: cargo test -q
