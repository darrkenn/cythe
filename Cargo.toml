[package]
name = "cythe"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_yaml = "0.9.34+deprecated"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = "0.12.24"
dotenv = "0.15.0"
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["full"] }
fern = "0.7.1"
chrono = "0.4.42"
log = "0.4.28"
hmac = "0.13.0-rc.3"
sha2 = "0.11.0-rc.3"
hex = "0.4.3"
subtle = "2.6.1"
bollard = "0.19.4"
futures-util = "0.3.31"
tar = "0.4.44"

[dependencies.uuid]
version = "1.18.1"
features = ["v4"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
rpath = false
incremental = false

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true
codegen-units = 32
lto = false
