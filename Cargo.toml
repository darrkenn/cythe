[package]
name = "cythe"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
bollard = "0.19.4"
chrono = "0.4.42"
dotenv = "0.15.0"
fern = "0.7.1"
futures-util = "0.3.31"
git2 = "0.20.2"
hex = "0.4.3"
hmac = "0.13.0-rc.3"
lazy_static = "1.5.0"
log = "0.4.28"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0-rc.3"
subtle = "2.6.1"
tera = { version = "1.20.1", default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tower-http = { version = "0.6.6", features = ["fs"] }
telefy = "1.0.1"
anyhow = "1.0.100"

[dependencies.uuid]
version = "1.18.1"
features = ["v4"]

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
lto = false
incremental = true
codegen-units = 32

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
